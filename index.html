<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDM Studio - Precedence Diagram Method Generator</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <!-- SheetJS for Excel Support -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header bar -->
    <header>
        <div class="header-title-container">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="6" height="6" rx="1" />
                    <rect x="15" y="3" width="6" height="6" rx="1" />
                    <rect x="9" y="15" width="6" height="6" rx="1" />
                    <path d="M6 9v6M18 9v6M9 6h6M15 18h3M6 15h3" />
                </svg>
            </div>
            <div>
                <h1>PDM Studio</h1>
                <div class="header-subtitle">Precedence Diagram Method Generator</div>
            </div>
        </div>

        <!-- Project Statistics Widget -->
        <div class="stats-container">
            <div class="stat-item">
                <span class="stat-val" id="statDuration">0</span>
                <span class="stat-lbl">Project Duration</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="statNodes">0</span>
                <span class="stat-lbl">Total Tasks</span>
            </div>
            <div class="stat-item" onclick="toggleCriticalPathFocus()" style="cursor: pointer;" title="Toggle Critical Path Focus">
                <span class="stat-val critical" id="statCritical">0</span>
                <span class="stat-lbl">Critical Path Tasks</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="statEfficiency">0%</span>
                <span class="stat-lbl">Critical Ratio</span>
            </div>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <!-- Data input card -->
            <div class="card">
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    Activity Data CSV
                </div>
                <div class="input-meta-links">
                    <span class="input-meta-link" onclick="showHelp()">Format Help</span>
                    <span class="input-meta-link" id="linkFileBtn" onclick="linkLocalFile()">Link Excel/CSV</span>
                    <span class="input-meta-link" onclick="clearInput()">Clear Data</span>
                </div>
                <textarea id="activityInput" placeholder="A1, Setup, 0, 5, 0, 5..." spellcheck="false">A1, 10, Setup, 0, 5, 0, 5
B1, 20, Design, 5, 15, 5, 15
C1, 30, Logic, 15, 30, 15, 30
D1, 40, QA, 15, 23, 22, 30
E1, 50, Release, 30, 35, 30, 35</textarea>
            </div>

            <!-- Excel Import Settings Card -->
            <div class="card">
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="9" y1="21" x2="9" y2="9" />
                    </svg>
                    Excel Selection
                </div>
                <div class="settings-grid">
                    <div class="control-group">
                        <label for="excelSheetName">Sheet Name</label>
                        <input type="text" id="excelSheetName" placeholder="e.g. Sheet1" onchange="syncWithLinkedFile(true)">
                    </div>
                </div>
            </div>

            <!-- Visual Settings Card -->
            <div class="card">
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                    Settings & Layout
                </div>
                <div class="settings-grid">
                    <div class="control-group" style="grid-column: span 2;">
                        <label for="calcModeSelect">Input & Calculation Mode</label>
                        <select id="calcModeSelect" onchange="changeCalcMode()">
                            <option value="manual">Manual Times (ES, EF, LS, LF)</option>
                            <option value="auto">Auto CPM (Duration, Predecessors)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="themeSelect">Color Theme</label>
                        <select id="themeSelect" onchange="changeTheme()">
                            <option value="midnight">Midnight Slate</option>
                            <option value="cyberpunk">Cyberpunk Neon</option>
                            <option value="emerald">Forest Emerald</option>
                            <option value="light">Classic Light</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="directionSelect">Layout Flow</label>
                        <select id="directionSelect" onchange="generatePDM()">
                            <option value="LR">Left to Right</option>
                            <option value="TB">Top to Bottom</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="generatePDM()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="23 4 23 10 17 10" />
                        <polyline points="1 20 1 14 7 14" />
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                    </svg>
                    Render Diagram
                </button>
            </div>
        </div>

        <!-- Right Viewport -->
        <div class="viewport">
            <!-- Viewport Tab Header -->
            <div class="viewport-header">
                <div class="viewport-tabs">
                    <button class="tab-btn active" id="tabBtn_diagram" onclick="switchTab('diagram')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <rect x="3" y="3" width="7" height="9" rx="1" />
                            <rect x="14" y="3" width="7" height="5" rx="1" />
                            <rect x="14" y="12" width="7" height="9" rx="1" />
                            <rect x="3" y="16" width="7" height="5" rx="1" />
                            <path d="M7 7.5h7M7 18.5h7" />
                        </svg>
                        Network Diagram
                    </button>
                    <button class="tab-btn" id="tabBtn_barchart" onclick="switchTab('barchart')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="18" y1="20" x2="18" y2="10" />
                            <line x1="12" y1="20" x2="12" y2="4" />
                            <line x1="6" y1="20" x2="6" y2="14" />
                        </svg>
                        Bar Chart (Gantt)
                    </button>
                    <button class="tab-btn" id="tabBtn_analysis" onclick="switchTab('analysis')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <line x1="16" y1="13" x2="8" y2="13" />
                            <line x1="16" y1="17" x2="8" y2="17" />
                            <polyline points="10 9 9 9 8 9" />
                        </svg>
                        Critical Path Analysis
                    </button>
                </div>
                <!-- Export buttons toolbar -->
                <div class="export-toolbar-container" style="display: flex; gap: 8px;">
                    <button class="export-btn" id="copyMermaidBtn" onclick="copyMermaidCode()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                        Copy Mermaid
                    </button>
                    <button class="export-btn" id="exportSvgBtn" onclick="downloadSVG()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        SVG
                    </button>
                    <button class="export-btn" id="exportPngBtn" onclick="downloadPNG()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        PNG
                    </button>
                </div>
            </div>

            <!-- Tab Content: Network Diagram -->
            <div id="tabContent_diagram" class="tab-content active">
                <div class="diagram-container-wrapper" id="diagramWrapper">
                    <div id="diagram" class="mermaid"></div>
                </div>
                <!-- Floating Viewport Controls -->
                <div class="floating-controls">
                    <button class="float-btn" onclick="adjustZoom(1.2)" title="Zoom In">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                    <button class="float-btn" onclick="adjustZoom(0.8)" title="Zoom Out">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                    <button class="float-btn" onclick="resetZoom()" title="Reset Zoom">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M15 3h6v6" />
                            <path d="M9 21H3v-6" />
                            <path d="M21 3l-7 7" />
                            <path d="M3 21l7-7" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tab Content: Bar Chart -->
            <div id="tabContent_barchart" class="tab-content">
                <div class="barchart-container-wrapper" id="barchartContainer"></div>
            </div>

            <!-- Tab Content: Analysis Dashboard -->
            <div id="tabContent_analysis" class="tab-content">
                <div class="analysis-container-wrapper" id="analysisContainer"></div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="toastIcon">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
        </svg>
        <span id="toastMessage">Success</span>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
